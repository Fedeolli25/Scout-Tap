<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#121923">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scout Tap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Scout Tap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: iPad-landscape console — scoreboard band on top, court + benches left, tap pad right, codes strip under the pad */
:root{
  --bg:#e9edf2; --surface:#ffffff; --surface2:#f3f5f8; --ink:#121923; --muted:#5a6676; --line:#d3dae3;
  --home:#2350d1; --home-soft:#dfe7fb; --away:#d4521c; --away-soft:#fbe5da;
  --court:#cfe0ec; --court-line:#ffffff; --net:#121923;
  --e-perf:#16824a; --e-pos:#3f9f68; --e-ex:#b98a10; --e-neg:#d97326; --e-poor:#7a4cc0; --e-err:#cf3434;
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1218; --surface:#161e28; --surface2:#1c2633; --ink:#e8edf3; --muted:#93a0b1; --line:#2a3644;
  --home:#6f93ff; --home-soft:#1d2b52; --away:#ff8a55; --away-soft:#4a2416;
  --court:#1f3242; --court-line:#3d5569; --net:#e8edf3;
  --e-perf:#3cc47d; --e-pos:#6bc792; --e-ex:#e2b43b; --e-neg:#f09650; --e-poor:#a984ec; --e-err:#f06464;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1218; --surface:#161e28; --surface2:#1c2633; --ink:#e8edf3; --muted:#93a0b1; --line:#2a3644;
  --home:#6f93ff; --home-soft:#1d2b52; --away:#ff8a55; --away-soft:#4a2416;
  --court:#1f3242; --court-line:#3d5569; --net:#e8edf3;
  --e-perf:#3cc47d; --e-pos:#6bc792; --e-ex:#e2b43b; --e-neg:#f09650; --e-poor:#a984ec; --e-err:#f06464;
  color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--home);outline-offset:2px}
.app{min-height:100%;display:flex;flex-direction:column;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 16px}

/* Scoreboard */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:44px;height:44px;border-radius:50%;flex:none;box-shadow:0 0 0 1px var(--line)}
.brand small{display:block;font-size:11px;font-family:var(--font-body);font-weight:500;letter-spacing:.06em;color:var(--muted)}
.sb{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:14px;background:var(--surface);border-radius:12px;padding:6px 14px;border:1px solid var(--line)}
.sb-team{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.sb-team.R{justify-content:flex-end;flex-direction:row-reverse}
.sb-name{font-family:var(--font-display);font-weight:600;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-team.h .sb-name{color:var(--home)} .sb-team.a .sb-name{color:var(--away)}
.tag{font-family:var(--font-mono);font-size:11px;padding:2px 6px;border-radius:6px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.serve-dot{width:12px;height:12px;border-radius:50%;flex:none;visibility:hidden}
.serve-dot.on{visibility:visible;background:var(--ink)}
.sb-mid{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.sb-sets{font-size:18px;color:var(--muted);font-weight:600}
.sb-score{font-size:40px;font-weight:700;line-height:1}
.sb-setno{font-size:12px;font-family:var(--font-body);color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.08em}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{padding:8px 12px;border-radius:7px;font-weight:500;color:var(--muted)}
.tabs button.on{background:var(--ink);color:var(--bg)}
.demo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface2);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted)}
.demo b{color:var(--ink)}

/* Scout layout */
.scout{flex:1;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
.left{display:flex;flex-direction:column;gap:10px;min-width:0}
.court{position:relative;aspect-ratio:2/1;max-width:100%;background:var(--court);border:3px solid var(--court-line);border-radius:6px;display:grid;gap:6px;padding:8px}
.court::before{content:"";position:absolute;top:-8px;bottom:-8px;left:50%;width:4px;margin-left:-2px;background:var(--net);border-radius:2px;z-index:0}
.court::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(33.33% - 1px),var(--court-line) calc(33.33% - 1px),var(--court-line) calc(33.33% + 1px),transparent calc(33.33% + 1px),transparent calc(66.67% - 1px),var(--court-line) calc(66.67% - 1px),var(--court-line) calc(66.67% + 1px),transparent calc(66.67% + 1px));pointer-events:none;z-index:0}
.court.players{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr)}
.court.zones{grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(3,1fr)}
.chip{position:relative;z-index:1;border-radius:10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;padding:2px;border:2px solid transparent;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chip .num{font-family:var(--font-display);font-weight:700;font-size:clamp(20px,3.4vw,32px);line-height:1}
.chip.h .num{color:var(--home)} .chip.a .num{color:var(--away)}
.chip .nm{font-size:11px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .role{position:absolute;top:3px;left:5px;font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.chip .zn{position:absolute;bottom:2px;right:5px;font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.chip .ball{position:absolute;top:4px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--ink)}
.chip.h.on{border-color:var(--home);background:var(--home-soft)}
.chip.a.on{border-color:var(--away);background:var(--away-soft)}
.chip.out{border-color:var(--e-err);border-style:dashed}
.zone{position:relative;z-index:1;border-radius:8px;border:2px dashed transparent;font-family:var(--font-display);font-weight:600;font-size:26px;color:var(--muted);background:color-mix(in srgb,var(--surface) 55%,transparent)}
.zone.h{color:var(--home)} .zone.a{color:var(--away)}
.zone.dim{opacity:.35}
.zone.pick{border-color:var(--ink);background:var(--surface)}
.tapcourt{width:100%;height:auto;display:block;touch-action:manipulation;cursor:crosshair;border-radius:8px;background:var(--surface2)}
.floor{fill:var(--court)}
.cl{fill:none;stroke:var(--court-line);stroke-width:.09}
.guide{stroke:var(--court-line);stroke-width:.04;stroke-dasharray:.25 .25;opacity:.8}
.netl{stroke:var(--net);stroke-width:.16;stroke-linecap:round}
.srvz{stroke-width:.06}.srvz.h{fill:var(--home-soft);stroke:var(--home)}.srvz.a{fill:var(--away-soft);stroke:var(--away)}
.srvz.on.h{fill:var(--home)}.srvz.on.a{fill:var(--away)}
.srvzt{font-family:var(--font-display);font-weight:700;font-size:.95px;text-anchor:middle;fill:var(--ink)}
.side{opacity:.55} .side.h{fill:var(--home-soft)} .side.a{fill:var(--away-soft)}
.mk{stroke:var(--surface);stroke-width:.08} .mk.h{fill:var(--home)} .mk.a{fill:var(--away)}
.mapsvg{width:100%;height:auto;display:block;max-width:820px;border-radius:10px;background:var(--surface2)}
.arr{stroke-width:.11;stroke-linecap:round;opacity:.8;fill:none}
.end{opacity:.95;stroke-width:0}
.k-p{stroke:var(--e-perf);fill:var(--e-perf)} .k-g{stroke:var(--e-pos);fill:var(--e-pos)} .k-x{stroke:var(--e-ex);fill:var(--e-ex)}
.k-n{stroke:var(--e-neg);fill:var(--e-neg)} .k-o{stroke:var(--e-poor);fill:var(--e-poor)} .k-e{stroke:var(--e-err);fill:var(--e-err)}
.heat{fill:var(--e-err);opacity:.3}
.zpct{font-family:var(--font-display);font-weight:700;font-size:.9px;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}
.zpct.small{font-size:.5px;font-weight:500;fill:var(--muted)}
.att-side{font-family:var(--font-body);font-size:.45px;fill:var(--muted);text-anchor:middle}
.mapctl{display:flex;flex-direction:column;gap:8px}
.mapctl .filters{align-items:center}
.mapctl select{font-size:13px;padding:6px 8px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.benches{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bench{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.bench .lbl{width:100%}
.bchip{font-family:var(--font-display);font-weight:600;font-size:18px;min-width:44px;height:40px;padding:0 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.bchip.h{color:var(--home)} .bchip.a{color:var(--away)}
.bchip.on{border:2px solid currentColor}
.bchip.lib{background:var(--surface2)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rally{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:44px}
.code{font-family:var(--font-mono);font-size:13px;padding:3px 7px;border-radius:6px;background:var(--surface2)}
.code.h{box-shadow:inset 3px 0 0 var(--home)} .code.a{box-shadow:inset 3px 0 0 var(--away)}

/* Pad */
.pad{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.who{display:flex;align-items:center;gap:10px;min-height:40px;font-size:15px}
.who .big{font-family:var(--font-display);font-weight:700;font-size:28px}
.who .big.h{color:var(--home)} .who .big.a{color:var(--away)}
.who .hint{color:var(--muted)}
.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.skills button{height:50px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.skills button b{font-family:var(--font-mono);font-size:16px}
.skills button span{font-size:11px;color:var(--muted)}
.skills button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.skills button.on span{color:var(--bg);opacity:.75}
.evals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.evals button{height:74px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;overflow:hidden}
.evals button::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.evals button b{font-family:var(--font-mono);font-size:28px;line-height:1;color:var(--c)}
.evals button span{font-size:12px;color:var(--muted)}
.evals button:active{background:var(--line)}
.dual{display:flex;flex-direction:column;gap:6px}
.evals.six{grid-template-columns:repeat(6,1fr);gap:5px}
.evals.six button{height:58px}
.evals.six button b{font-size:22px}
.evals.six button span{font-size:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:600;padding:0 10px}
.btn.h{background:var(--home);color:#fff;border-color:var(--home)}
.btn.a{background:var(--away);color:#fff;border-color:var(--away)}
.btn.ghost{background:none}
.btn.err{background:none;font-weight:500;font-size:14px}
.btn.err.h{color:var(--home);border-color:var(--home)} .btn.err.a{color:var(--away);border-color:var(--away)}
.infogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.home{display:flex;flex-direction:column;gap:14px;max-width:1000px;width:100%;margin:0 auto}
.hero{display:flex;align-items:center;gap:18px;padding:8px 4px}
.hero img{width:96px;height:96px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.hero h1{font-family:var(--font-display);font-size:44px;margin:0;line-height:1;text-transform:uppercase;letter-spacing:.03em}
.hero p{margin:4px 0 0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-height:120px}
.card .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-family:var(--font-display);font-size:22px;font-weight:700}
.card b{font-family:var(--font-display);font-size:24px;font-weight:700}
.card small{color:var(--muted);font-size:13px}
.card.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card.main small{color:var(--bg);opacity:.75}.card.main .ic{background:var(--home);color:#fff}
.card:disabled{opacity:.5;cursor:default}
button.brand{background:none;border:0;padding:0;text-align:left;color:inherit}
.linkbtn{background:none;border:0;padding:0;color:var(--home);text-decoration:underline;font:inherit;cursor:pointer}
.matches .match{cursor:default}
.mbtns{display:flex;gap:6px;flex-wrap:wrap}
.arow{display:flex;gap:8px;align-items:center}.arow .match{flex:1;min-width:0}.arow>.btn{flex:none;width:auto}
.btn.friendly{border-color:var(--e-ex);color:var(--ink);background:color-mix(in srgb,var(--e-ex) 18%,var(--surface))}
.btn.danger{color:var(--e-err);border-color:var(--e-err)}
.teamlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.tchip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);text-align:left}
.tchip b{font-size:15px}.tchip small{color:var(--muted)}
.tchip.on{border:2px solid var(--ink)}
.tchip.add{border-style:dashed;background:none}
@media (max-width:640px){.cards{grid-template-columns:1fr}.hero h1{font-size:34px}.arow{flex-wrap:wrap}}
.dvwbox{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px;max-width:640px}
.filebtn{display:inline-flex;align-items:center;cursor:pointer}
.btn.to{background:none;font-weight:500;font-size:13px;height:40px}
.faults{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.faults .btn{height:52px}
.btn.on{background:var(--ink);color:var(--bg)}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.askserve{max-width:820px}.askserve h2{font-size:30px}
.card.serve.h b{color:var(--home)}.card.serve.a b{color:var(--away)}
.card.serve.h .ic{color:var(--home)}.card.serve.a .ic{color:var(--away)}
.card.serve.sug{border:2px solid var(--ink)}
.bctl{display:flex;gap:6px;width:100%;flex-wrap:wrap}
.btn.sm{height:38px;font-size:13px;font-weight:500;flex:1;min-width:0}
.bchip small{font-family:var(--font-mono);font-size:10px;opacity:.7}
.chip.isl{background:color-mix(in srgb,var(--e-ex) 22%,var(--surface))}
.chip.issub::after{content:"";position:absolute;bottom:4px;left:6px;width:6px;height:6px;border-radius:50%;background:var(--muted)}
.stype{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.stype button{height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-size:13px}
.stype button b{font-family:var(--font-mono)}
.stype button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sync{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--e-perf)} .sync.busy i{background:var(--e-ex)} .sync.err i{background:var(--e-err)}
.matches{display:flex;flex-direction:column;gap:6px}
.match{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);text-align:left}
.match.on{border-color:var(--ink);border-width:2px}
.match small{color:var(--muted)}
.tools .btn{height:42px;font-size:13px;font-weight:500}
.log{display:flex;flex-direction:column;gap:3px;max-height:150px;overflow:auto;border-top:1px solid var(--line);padding-top:8px}
.log .ln{font-family:var(--font-mono);font-size:12px;display:flex;gap:10px;color:var(--muted)}
.log .ln b{color:var(--ink);font-weight:600}
.log .ln.auto b{font-weight:400;font-style:italic}
.panel-big{display:flex;flex-direction:column;gap:12px;padding:8px 0}
.panel-big h2{font-family:var(--font-display);font-size:30px;margin:0}

/* Stats, codes, setup */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sheet h2{font-family:var(--font-display);font-size:24px;margin:0;font-weight:700;text-wrap:balance}
.sheet h2.h{color:var(--home)} .sheet h2.a{color:var(--away)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 7px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th.grp{text-align:center;border-bottom:0}
tr.tot td{font-weight:600;border-top:2px solid var(--line)}
table.stats .g0{border-left:1px solid var(--line)}
.formula{font-size:12px}
.pct-good{color:var(--e-perf)} .pct-bad{color:var(--e-err)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
pre.codes{font-family:var(--font-mono);font-size:13px;line-height:1.55;background:var(--surface2);border-radius:10px;padding:12px;margin:0;max-height:60vh;overflow:auto;-webkit-user-select:text;user-select:text;white-space:pre}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
input[type=text],textarea,select{font:inherit;font-size:15px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;-webkit-user-select:text;user-select:text;min-width:0}
textarea{font-family:var(--font-mono);font-size:13px;min-height:190px;resize:vertical}
.lineup{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lineup .cap{grid-column:1/-1;font-size:11px;color:var(--muted)}
.lineup label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);font-family:var(--font-mono)}
.note{font-size:13px;color:var(--muted);line-height:1.5;max-width:70ch}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}

@media (max-width:1280px){.brand>span{display:none}}
@media (max-width:860px){
  .scout,.grid2{grid-template-columns:1fr}
  .sb-score{font-size:30px}
  .tools{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:520px){
  .sb{flex-wrap:wrap}
  .sb-name{font-size:16px}
  .benches{grid-template-columns:1fr}
  .chip .nm{display:none}
  .evals button{height:62px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function zoneOf(x,y){
  const half=x<9?'h':'a';
  let d=half==='h'?9-x:x-9, lat=half==='h'?y:9-y;
  d=Math.min(Math.max(d,0),8.999);lat=Math.min(Math.max(lat,0),8.999);
  const row=Math.floor(d/3),li=Math.floor(lat/3);
  const fd=(d%3)<1.5?0:1, fl=(lat%3)<1.5?0:1;
  return{half,z:ZT[row][li],sub:SUB[fd][fl]};
}
function zoneCenter(t,z,serve){
  if(serve&&SRVZ.includes(+z)){const lat=SRVZ.indexOf(+z)*1.8+.9;return t==='h'?{x:-1.2,y:lat}:{x:19.2,y:9-lat}}

}

function parseRoster(txt){
  return txt.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.match(/^(\d{1,2})\s+(.*?)(?:\s+([PSCOL]))?$/i);
    if(!m)return null;
    return{n:+m[1],name:m[2].trim(),role:(m[3]||'').toUpperCase()};
  }).filter(Boolean);
}

function setterIdx(t){
  if(!S.setter)S.setter={h:null,a:null};

  if(sn==null){const f=S.lineup[t].find(n=>(P(t,n)||{}).role==='P');if(f!=null)S.setter[t]=sn=f}

}

function dblStart(t){

function libOut(t,silent){

/* correlazione esiti */
const MAP_RS={'#':'-','+':'-','!':'!','-':'+','/':'/','=':'#'};

const MAP_DA={'#':'-','+':'-','!':'+','-':'+','/':'+','=':'#'};

  else if(a.sk==='B'&&prev.sk==='A')m=MAP_BA;

const STAT_DEF={

const COLN={tot:'Tot','#':'#','=':'Err',prf:'Prf',pos:'Pos',eff:'Eff'};
function statRows(t,acts){
  const pl=S.teams[t].players.slice().sort((x,y)=>x.n-y.n);

  const cell=(sk,list)=>{
    const d=STAT_DEF[sk],L=list.filter(a=>a.sk===sk),n=L.length,c=e=>L.filter(a=>e.includes(a.ev)).length;
    const pos=c(d.pos),eff=c(d.effP)-c(d.effN);

      if(k==='tot')return`<td class="g0">${n}</td>`;
      if(k==='pos')return`<td>${pct(pos,n)}</td>`;

    <tbody>${rows.map(x=>row(x.p.n,x.p.name,x.L)).join('')||`<tr><td colspan="${ncol}" style="text-align:left">Nessuna azione registrata</td></tr>`}${row('','Squadra',mine,'tot')}</tbody></table></div>
    <p class="note formula">Pos = palloni # e + sul totale. Eff: battuta (# − errori), ricezione (# + − / − errori), attacco e muro (# − / − errori), difesa (# + − errori), sempre sul totale.</p>`;

function rotTable(t,rallies){

const hms=ms=>ms?new Date(ms).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'--:--:--';

/* ---------- export Data Volley (.dvw) ---------- */
function parseClock(v){const p=String(v||'0').trim().split(':').map(Number);if(p.some(isNaN))return 0;return p.reduce((a,x)=>a*60+x,0)}
function dvw(){
  fixArrays();
  const CR='\r\n',now=new Date(),pad=n=>String(n).padStart(2,'0');
  const dTxt=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`,tTxt=d=>`${pad(d.getHours())}.${pad(d.getMinutes())}.${pad(d.getSeconds())}`;
  const firstT=S.ltimes.find(Boolean)||Date.now(),d0=new Date(firstT);
  const yr=d0.getMonth()>=7?d0.getFullYear():d0.getFullYear()-1;
  // tempo video: la prima battuta della partita cade al secondo indicato
  const fs=S.actions.find(a=>a.sk==='S'&&a.li!=null&&S.ltimes[a.li]);
  const t0=fs?S.ltimes[fs.li]:firstT,off=parseClock(S.videoStart);
  const vsec=t=>Math.max(0,Math.round(off+((t||t0)-t0)/1000));
  const tcode=n=>(n||'').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()||'TEA';
  const won=t=>setsWon(t);
  let o='[3DATAVOLLEYSCOUT]'+CR+'FILEFORMAT: 2.0'+CR+
    `GENERATOR-DAY: ${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())} ${tTxt(now)}`+CR+'GENERATOR-IDP: DVW'+CR+'GENERATOR-PRG: Scout Tap'+CR+'GENERATOR-REL: '+CR+'GENERATOR-VER: 1.0'+CR+'GENERATOR-NAM: '+CR+
    `LASTCHANGE-DAY: ${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())} ${tTxt(now)}`+CR+'LASTCHANGE-IDP: DVW'+CR+'LASTCHANGE-PRG: Scout Tap'+CR+'LASTCHANGE-REL: '+CR+'LASTCHANGE-VER: 1.0'+CR+'LASTCHANGE-NAM: '+CR;
  o+='[3MATCH]'+CR+`${dTxt(d0)};${tTxt(d0)};${yr}/${yr+1};;;;;;1;;;;`+CR+';;;;;;;;;;;;'+CR;
  o+='[3TEAMS]'+CR+`${tcode(S.teams.h.name)};${S.teams.h.name};${won('h')};;;;;;;`+CR+`${tcode(S.teams.a.name)};${S.teams.a.name};${won('a')};;;;;;;`+CR;
  o+='[3MORE]'+CR+';;;;;;;'+CR+'[3COMMENTS]'+CR+';;;;;'+CR;
  // set: parziali a 8, 16, 21, finale, durata in minuti
  o+='[3SET]'+CR;
  for(let k=1;k<=5;k++){
    const rs=S.rallies.filter(r=>r.set===k);
    if(!rs.length){o+='False;;;;;;'+CR;continue}
    let h=0,a=0;const part={};
    rs.forEach(r=>{r.winner==='h'?h++:a++;for(const q of [8,16,21])if(!part[q]&&(h>=q||a>=q))part[q]=`${h}-${a}`});
    const fin=S.sets[k-1]?`${S.sets[k-1].h}-${S.sets[k-1].a}`:''; // set non finito: niente risultato finale
    const ts=S.lines.map((c,i)=>(S.lsnap[i]||'').split('|')[0]==String(k)?S.ltimes[i]:null).filter(Boolean);
    const dur=ts.length?Math.round((Math.max(...ts)-Math.min(...ts))/60000):'';
    o+=`True;${part[8]||''};${part[16]||''};${part[21]||''};${fin};${dur};`+CR;
  }
  // giocatori: posizioni di partenza per set, ruolo dal primo set in cui sono titolari
  const DVROLE={P:5,O:3,S:2,C:4};
  const players=t=>S.teams[t].players.slice().sort((x,y)=>x.n-y.n).map((p,i)=>{
    const pos=[1,2,3,4,5].map(k=>{const L=S.setLineups[k];if(!L)return'*';const z=L[t].findIndex(x=>x==p.n);return z<0?'*':String(z+1)});
    let role=p.role==='L'?1:6;
    if(role===6)for(let k=1;k<=5&&role===6;k++){const L=S.setLineups[k];if(!L)continue;const z=L[t].findIndex(x=>x==p.n);if(z<0)continue;const si=L[t].findIndex(x=>x==(t==='h'?L.sh:L.sa));if(si>=0)role=DVROLE[SEATS[(z-si+6)%6]]}
    return `${t==='h'?0:1};${p.n};${i+1};${pos.join(';')};${t==='h'?'H':'V'}${p2(p.n)};${p.name};;;${p.role==='L'?'L':''};${role};False;;;`;
  });
  o+='[3PLAYERS-H]'+CR+players('h').join(CR)+CR+'[3PLAYERS-V]'+CR+players('a').join(CR)+CR;
  o+='[3ATTACKCOMBINATION]'+CR+'[3SETTERCALL]'+CR+'[3WINNINGSYMBOLS]'+CR+'[3RESERVE]'+CR+'[3VIDEO]'+CR+'Camera0='+CR;
  // scout: ogni riga con orario, set, posizioni palleggiatori, tempo video e i 12 in campo
  o+='[3SCOUT]'+CR;
  const row=(code,t,sn)=>{const [st,rh,ra,hh,aa]=sn.split('|');const d=new Date(t||t0);
    return `${code};;;;;;;${tTxt(d)};${st};${rh};${ra};1;${vsec(t)};;${hh.split(',').join(';')};${aa.split(',').join(';')};`};
  let curSet=0,prev={h:null,a:null};
  S.lines.forEach((c,i)=>{

/* ---------- analisi partita per i report ---------- */
function analyze(){
  fixArrays();
  const byLi=new Map();S.actions.forEach(a=>{if(a.li!=null)byLi.set(a.li,a)});
  const rallies=[],events=[];let cur=[],ri=0,lastSet=0,score={h:0,a:0};
  S.lines.forEach((c,i)=>{
    const a=byLi.get(i);
    const set=+((S.lsnap[i]||'').split('|')[0])||(a&&a.set)||1;
    if(set!==lastSet){lastSet=set;score={h:0,a:0}}
    if(a){cur.push(a);return}
    const pm=c.match(/^([*a])p(\d\d):(\d\d)/);
    if(pm){const r=S.rallies[ri++];score={h:+pm[2],a:+pm[3]};if(r)rallies.push({...r,acts:cur,t:S.ltimes[i],sh:score.h,sa:score.a});cur=[];return}
    const tm=c.match(/^([*a])T$/);
    if(tm){events.push({kind:'to',team:tm[1]==='*'?'h':'a',set,t:S.ltimes[i],sh:score.h,sa:score.a,after:rallies.length});return}
    const sm=c.match(/^([*a])c(\d\d):(\d\d)$/);
    if(sm)events.push({kind:'sub',team:sm[1]==='*'?'h':'a',out:+sm[2],inn:+sm[3],set,t:S.ltimes[i],sh:score.h,sa:score.a,after:rallies.length});
  });
  rallies.forEach(r=>{
    const e=r.acts.find(x=>ending(x.sk,x.ev));r.end=e||null;
    let cause='man',scorer=null;
    if(e){
      const res=ending(e.sk,e.ev);
      if(res==='self'){cause=e.sk==='S'?'Bat':e.sk==='A'?'Att':'Mur';scorer=e}
      else if(e.sk==='A'&&e.ev==='/'){cause='Mur';scorer=r.acts.find(x=>x.sk==='B'&&x.ev==='#'&&x.team===r.winner)||null}
      else cause='Err';
    }
    r.cause=cause;r.scorer=scorer;
  });
  return{rallies,events};
}
const pctTxt=(a,b)=>b?Math.round(a/b*100)+'%':'';
const zTxt=v=>v?String(v):'.';
function skillStats(L){
  const c=(sk,e)=>L.filter(a=>a.sk===sk&&(!e||e.includes(a.ev))).length;
  const sT=c('S'),sE=c('S','='),sP=c('S','#');
  const rT=c('R'),rE=c('R','='),rPos=c('R','#+'),rPrf=c('R','#'),rSl=c('R','/');
  const aT=c('A'),aE=c('A','='),aM=c('A','/'),aP=c('A','#');
  const bP=c('B','#'),bE=c('B','/=');
  const eE=c('E','='),fE=c('F','=');
  return{sT,sE,sP,rT,rE,rPos,rPrf,rSl,aT,aE,aM,aP,bP,bE,eE,fE,
    pts:sP+aP+bP,errs:sE+rE+aE+aM+bE+eE+fE};
}
function report(){
  const {rallies,events}=analyze();

  const out={rallies,events,sets,team:{}};
  for(const t of ['h','a']){
    const acts=S.actions.filter(a=>a.team===t&&a.sk!=='&');
    const faults=S.actions.filter(a=>a.team===t&&a.sk==='&');
    const players=S.teams[t].players.slice().sort((x,y)=>x.n-y.n).map(p=>{
      const L=acts.filter(a=>a.num==p.n),st=skillStats(L);
      const bp=rallies.filter(r=>r.serving===t&&r.winner===t&&r.scorer&&r.scorer.team===t&&r.scorer.num==p.n).length;
      const setMarks=Array.from({length:Math.max(5,S.set||1)},(_,i)=>i+1).map(k=>{
        const SL=S.setLineups&&S.setLineups[k];if(!SL)return'';
        const z=SL[t].findIndex(x=>x==p.n);if(z>=0)return'z'+(z+1);
        const played=events.some(e=>e.kind==='sub'&&e.team===t&&e.set===k&&e.inn==p.n)||L.some(a=>a.set===k);
        return played?'-':'';
      });
      return{p,st,bp,vp:st.pts-st.errs,setMarks};
    });
    const tot=skillStats(acts);
    const perSet=sets.map(k=>{
      const R=rallies.filter(r=>r.set===k&&r.winner===t);
      return{k,bat:R.filter(r=>r.cause==='Bat').length,att:R.filter(r=>r.cause==='Att').length,mur:R.filter(r=>r.cause==='Mur').length,
        err:R.filter(r=>r.cause==='Err'||r.cause==='man').length,st:skillStats(acts.filter(a=>a.set===k)),falli:faults.filter(a=>a.set===k).length};
    });
    const rec=rallies.filter(r=>r.serving!==t),srv=rallies.filter(r=>r.serving===t);
    const rotKey=t==='h'?'rotH':'rotA';
    const rot=[1,2,3,4,5,6].map(i=>{const R=rallies.filter(r=>r[rotKey]===i);return{i,diff:R.filter(r=>r.winner===t).length-R.filter(r=>r.winner!==t).length,n:R.length}});
    // attacco dopo ricezione positiva / negativa e contrattacco
    const grp={pos:[],neg:[],ca:[]};
    rallies.forEach(r=>{
      let recv=null,firstDone=false;

    });
    const att=L=>{const T=L.length,E=L.filter(a=>a.ev==='=').length,M=L.filter(a=>a.ev==='/').length,P=L.filter(a=>a.ev==='#').length;return{T,E,M,P,pp:pctTxt(P,T),eff:pctTxt(P-E-M,T)}};
    const tos=sets.map(k=>events.filter(e=>e.kind==='to'&&e.team===t&&e.set===k).map(e=>`${e.sh}-${e.sa}`));
    out.team[t]={players,tot,falli:faults.length,perSet,
      pts:players.reduce((s,x)=>s+x.st.pts,0),bpTot:players.reduce((s,x)=>s+x.bp,0),vpTot:players.reduce((s,x)=>s+x.vp,0),
      recN:tot.rT,cp:rec.filter(r=>r.winner===t).length,recRallies:rec.length,
      srvN:tot.sT,bp:srv.filter(r=>r.winner===t).length,srvRallies:srv.length,
      rot,cpd:{pos:att(grp.pos),neg:att(grp.neg),ca:att(grp.ca)},tos};
  }
  out.setRows=sets.map(k=>{
    const R=rallies.filter(r=>r.set===k);let h=0,a=0;const part={};
    R.forEach(r=>{r.winner==='h'?h++:a++;for(const q of [8,16,21])if(!part[q]&&(h>=q||a>=q))part[q]=`${h}-${a}`});
    const ts=S.lines.map((c,i)=>(S.lsnap[i]||'').split('|')[0]==String(k)?S.ltimes[i]:null).filter(Boolean);
    const dur=ts.length?Math.round((Math.max(...ts)-Math.min(...ts))/60000):0;
    const subs=t=>events.filter(e=>e.kind==='sub'&&e.team===t&&e.set===k).map(e=>`${e.out}>${e.inn}`).join(' ');
    return{k,dur,part,h,a,fin:S.sets[k-1]?`${S.sets[k-1].h}-${S.sets[k-1].a}`:`${h}-${a}`,done:!!S.sets[k-1],subsH:subs('h'),subsA:subs('a')};
  });
  return out;
}

const ENDTXT={'S#':'Ace','S=':'Errore in battuta','R=':'Errore in ricezione','A#':'Attacco punto','A=':'Errore in attacco','A/':'Attacco murato',

function rallyText(r){

  let s=`${ENDTXT[e.sk+e.ev]||SKN[e.sk]} ${pname(e.team,e.num)}`;

async function buildPlayByPlay(){
  const jsPDF=await pdfLib();const R=report();
  const doc=new jsPDF({unit:'mm',format:'a4'});const W=doc.internal.pageSize.getWidth(),M=12;
  pdfHeader(doc,'Play by play');
  let y=30;
  doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(...PDFC.home);doc.text(L1(S.teams.h.name),M,y);
  doc.setTextColor(...PDFC.ink);doc.text(`${setsWon('h')} - ${setsWon('a')}`,W/2,y,{align:'center'});
  doc.setTextColor(...PDFC.away);doc.text(L1(S.teams.a.name),W-M,y,{align:'right'});y+=4;
  R.sets.forEach(k=>{
    const sr=R.setRows.find(x=>x.k===k);
    const rs=R.rallies.filter(r=>r.set===k);
    const ev=R.events.filter(e=>e.set===k);
    const body=[];let n=0;
    const evRow=e=>{const tn=S.teams[e.team].name;
      const txt=e.kind==='to'?`Time out ${tn}`:`Cambio ${tn}: esce ${pname(e.team,e.out)}, entra ${pname(e.team,e.inn)}`;
      return[{content:'',styles:{}},`${e.sh}-${e.sa}`,{content:L1(txt),colSpan:4,styles:{fontStyle:'italic',textColor:PDFC.muted}}]};
    const before=i=>ev.filter(e=>e.after===i);
    rs.forEach(r=>{
      const gi=R.rallies.indexOf(r);
      before(gi).forEach(e=>body.push(evRow(e)));
      n++;
      const srv=r.acts.find(a=>a.sk==='S');
      const srvTxt=srv?`${pname(srv.team,srv.num)}${srv.ty?' ('+srv.ty+')':''}`:S.teams[r.serving].name;
      const rotS=r.serving==='h'?r.rotH:r.rotA;
      body.push([n,`${r.sh}-${r.sa}`,{content:L1(srvTxt),styles:{textColor:r.serving==='h'?PDFC.home:PDFC.away}},'P'+(rotS||'?'),L1(rallyText(r)),{content:L1(S.teams[r.winner].name),styles:{textColor:r.winner==='h'?PDFC.home:PDFC.away,fontStyle:'bold'}}]);
      body[body.length-1].win=r.winner;
    });
    ev.filter(e=>e.after>=R.rallies.length||(rs.length&&e.after>R.rallies.indexOf(rs[rs.length-1]))).forEach(e=>body.push(evRow(e)));
    doc.autoTable({startY:y+2,margin:{left:M,right:M,top:16},theme:'plain',
      styles:{font:'helvetica',fontSize:7.4,cellPadding:{top:.7,bottom:.7,left:1,right:1},textColor:PDFC.ink,lineColor:PDFC.line,lineWidth:{bottom:.1}},
      headStyles:{fontStyle:'bold',fillColor:PDFC.head},
      head:[[{content:L1(`Set ${k}   ${sr.fin}${sr.done?'':' (in corso)'}   ·   durata ${hm(sr.dur)}   ·   parziali ${[8,16,21].map(q=>sr.part[q]).filter(Boolean).join('  ')}`),colSpan:6,styles:{fontSize:9,fillColor:PDFC.ink,textColor:[255,255,255]}}],
        ['#','Punteggio','Batte','Rot','Come è finita','Punto a']],
      body,
      columnStyles:{0:{cellWidth:8,halign:'right',textColor:PDFC.muted},1:{cellWidth:17,halign:'center',fontStyle:'bold'},2:{cellWidth:36},3:{cellWidth:9,halign:'center'},5:{cellWidth:32}},
      didParseCell:h=>{if(h.section==='body'&&h.row.raw&&h.row.raw.win)h.cell.styles.fillColor=h.row.raw.win==='h'?PDFC.homeSoft:PDFC.awaySoft}});
    y=doc.lastAutoTable.finalY+6;
  });
  pdfFooter(doc);
  return doc;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(!wake&&navigator.wakeLock){navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{wake='no'})}
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT'||b.tagName==='TEXTAREA'||b.tagName==='INPUT')return;
  const act=b.dataset.act,t=b.dataset.t,n=b.dataset.n?+b.dataset.n:null;
  if(act!=='reset')S.confirmReset=false;
  const nLines=S.lines.length,nHist=hist.length;
  switch(act){
    case 'view':S.view=b.dataset.v;if(['home','archive'].includes(S.view))archPut(true);break;
    case 'player':{
      if(S.link){
        if(S.link.team!==t){toast(`Tocca un giocatore di ${S.teams[S.link.team].name}`);return}
        if(S.link.kind==='R'){recordLink(t,n,'R','=');break}
        if(S.link.kind==='B'){recordLink(t,n,'B','#');break}
        S.link.num=n;break;
      }
      if(S.libMode){
        if(S.libMode.team!==t){toast('Tocca un giocatore della squadra del libero');return}
        if(!S.libMode.lib){toast('Scegli prima quale libero entra');return}
        snap();if(libIn(t,S.libMode.lib,n))S.libMode=null;else hist.pop();break;
      }
      if(S.subMode){
        if(S.subMode.team!==t){toast('Tocca un giocatore della squadra che fa il cambio');return}
        const op=openPairOf(t,n);
        if(op){snap();if(doSub(t,n,op.starter))S.subMode=null;else hist.pop();break}
        const L=libOf(t);if(L&&L.num==n){toast('Per il libero usa il bottone Libero');return}
        S.subMode.out=n;break;
      }
      if(!S.sel)predict();
      if(S.sel.team!==t){const p=predictObj();S.sel={...p,num:null};if(p.team!==t){S.sel.sk=S.rally.length?'D':(t===S.serving?'S':'R');S.sel.auto=!!S.rally.length;S.sel.afterAtt=lastOppAttack(t)}}
      S.sel.team=t;S.sel.num=n;break;}
    case 'bench':{
      if(S.link){
        if(S.link.team!==t){toast(`Tocca un giocatore di ${S.teams[S.link.team].name}`);return}
        if(S.link.kind==='R'){recordLink(t,n,'R','=');break}
        if(S.link.kind==='AD'){S.link.num=n;break}
        toast('Il libero non può murare');return;
      }
      if(S.dblMode){if(S.dblMode.team!==t){toast('Tocca la panchina della squadra che fa il doppio cambio');return}dblPick(t,n);break}
      if(S.subMode&&S.subMode.team===t){
        if(!S.subMode.out){toast('Prima tocca in campo chi esce');return}
        snap();if(doSub(t,S.subMode.out,n))S.subMode=null;else hist.pop();break;
      }
      if(!S.sel)predict();
      if(S.sel.team!==t){const p=predictObj();S.sel.sk=p.team===t?p.sk:'D'}
      S.sel.team=t;S.sel.num=n;break;}
    case 'skill':S.sel.sk=b.dataset.k;S.sel.auto=false;break;
    case 'fault':S.fault=S.fault===t?null:t;S.pending=null;break;
    case 'faultr':{const ft=S.fault;S.fault=null;if(!ft)return;commit({team:ft,num:'$$',sk:'&',ty:'H',ev:'=',reason:b.dataset.r});toast(`${b.dataset.r}: punto ${S.teams[opp(ft)].name}`);return;}
    case 'stype':S.srvType[S.sel.team+S.sel.num]=b.dataset.k;break;
    case 'autoset':S.autoSet=!S.autoSet;break;
    case 'swap':S.swap=!S.swap;toast(`Ora ${S.teams[sides()[0]].name} è a sinistra`);break;
    case 'listm':listMatches();return;
    case 'resume':{const r=resumable();if(!r)return;if(r.current){S.view=S.started?'scout':'setup';break}openAny(r.id,'scout');return;}
    case 'openx':openAny(b.dataset.id,b.dataset.v);return;
    case 'delask':delAsk=b.dataset.id;render();return;
    case 'delm':delAsk=null;deleteMatch(b.dataset.id);return;
    case 'tedit':teamEdit=b.dataset.id;teamDel=false;render();return;
    case 'tnew':{const tm=newTeam('');libSave();teamEdit=tm.id;teamDel=false;render();setTimeout(()=>{const el=document.getElementById('tl-name');if(el){el.select();el.focus()}},50);return;}
    case 'tdone':teamEdit=null;teamDel=false;render();return;
    case 'tdel':if(!teamDel){teamDel=true;render();return}LIB.teams=LIB.teams.filter(x=>x.id!==teamEdit);libSave();teamEdit=null;teamDel=false;toast('Squadra eliminata');render();return;
    case 'nmcreate':createMatch();return;
    case 'closematch':S.finished=true;S.view='stats';archPut(true);toast('Rilevazione chiusa: la partita è in Partite e statistiche');break;
    case 'friendly':S.friendly=true;S.finished=false;nextSet();toast(`Amichevole: imposta la formazione del set ${S.set}`);return;
    case 'finish':S.finished=!S.finished;toast(S.finished?'Partita conclusa: la trovi in Partite e statistiche':'Partita riaperta');break;
    case 'openm':openMatch(b.dataset.id);return;
    case 'clearsel':S.sel.num=null;break;
    case 'eval':{
      const s=S.sel;if(!s||!s.num){toast('Tocca prima il giocatore');return}
      const a={team:s.team,num:s.num,sk:b.dataset.sk||s.sk,ev:b.dataset.e};
      if(S.zonesOn&&(a.sk==='S'||a.sk==='A')&&a.ev!=='='){S.pending={...a,sz:null,ez:null};break}
      commit(a);return;}
    case 'tap':{
      const p=S.pending;if(!p)return;
      const pt=b.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
      const q=pt.matrixTransform(b.getScreenCTM().inverse());
      let x=r1(Math.min(Math.max(q.x,-3),21)),y=r1(Math.min(Math.max(q.y,-1.5),10.5));
      if(S.swap){x=r1(18-x);y=r1(9-y)}
      const half=x<9?'h':'a';
      const setStart=()=>{if(p.sk==='S'){const q2=servePt(p.team,y);p.sx=q2.x;p.sy=q2.y;p.sz=serveZone(p.team,y)}else{p.sx=x;p.sy=y;p.sz=zoneOf(x,y).z}};
      if(!p.sz){
        if(half!==p.team){toast(p.sk==='S'?'Tocca la fascia di battuta dietro il campo di chi batte':'Prima il punto di partenza, nel campo di chi gioca');return}
        setStart();break;
      }
      if(half===p.team){setStart();toast('Partenza spostata');break}
      const zz=zoneOf(x,y);p.ex=x;p.ey=y;p.ez=zz.z;p.esub=zz.sub;
      commit({...p});return;}
    case 'map':{const k=b.dataset.k,v=b.dataset.v;S.map[k]=S.map[k]===v&&k!=='team'&&k!=='sk'&&k!=='mode'?'':v;if(k==='team')S.map.pl='';if(k==='sk'&&v!=='S')S.map.ty='';break}
    case 'zskip':{const a={...S.pending};if(!a.sz){a.sz=null}commit(a);return;}
    case 'zcancel':S.pending=null;break;
    case 'point':snap();endRally(t);break;
    case 'undo':if(!hist.length){toast('Niente da annullare');return}S=JSON.parse(hist.pop());S.confirmReset=false;toast('Annullato');break;
    case 'linkskip':S.link=null;break;
    case 'linkad':{const L=S.link;if(!L||!L.num)return;recordLink(L.team,L.num,b.dataset.k,'=');break}
    case 'timeout':{
      if(!S.timeouts)S.timeouts={h:0,a:0};
      if(S.timeouts[t]>=2){toast(`${S.teams[t].name} ha già chiamato 2 time out in questo set`);return}
      snap();S.timeouts[t]++;addLine(`${tc(t)}T`);
      toast(`Time out ${S.teams[t].name} (${S.timeouts[t]}/2) · ${new Date().toLocaleTimeString('it-IT')}`);break;}
    case 'sub':S.subMode=S.subMode&&S.subMode.team===t?null:{team:t,out:null};S.libMode=null;S.dblMode=null;break;
    case 'dbl':S.subMode=null;S.libMode=null;if(S.dblMode&&S.dblMode.team===t){S.dblMode=null;break}dblStart(t);break;
    case 'lib':{
      S.subMode=null;S.dblMode=null;
      if(S.libMode&&S.libMode.team===t){S.libMode=null;break}
      const ls=liberos(t);if(!ls.length){toast('Nessun libero in rosa: segna il ruolo L in Squadre');return}
      S.libMode={team:t,lib:ls.length===1&&!libOf(t)?ls[0].n:null};break;}
    case 'libpick':{
      const L=libOf(t);
      if(L&&L.num!=n){snap();const i=S.lineup[t].findIndex(x=>x==L.num);S.lineup[t][i]=n;toast(`Cambio libero: entra ${n}, esce ${L.num}`);L.num=n;S.libMode=null;break}
      S.libMode.lib=n;break;}
    case 'libout':snap();libOut(t);S.libMode=null;break;
    case 'zones':S.zonesOn=!S.zonesOn;break;
    case 'nextset':nextSet();return;
    case 'statset':S.statSet=b.dataset.s;break;
    case 'fs':S.firstServe=t;break;
    case 'startset':startSet();return;
    case 'askserve':{const e=lineupError();if(e){toast(e);return}S.askServe=true;window.scrollTo(0,0);break;}
    case 'askcancel':S.askServe=false;break;
    case 'servepick':S.firstServe=t;startSet();return;
    case 'reset':
      if(!S.confirmReset){S.confirmReset=true;break}
      {const keep=S.teams,st=S.start;S=blank();S.teams=keep;S.start=st;hist=[];toast('Nuova partita: rose mantenute, scegli le formazioni');if(db){subscribe();listMatches()}}
      break;
    case 'sheetslink':linkSheets(document.getElementById('sh-url').value,document.getElementById('sh-key').value);return;
    case 'sheetsunlink':unlinkSheets();return;
    case 'dldvw':downloadFile(fileBase()+'.dvw',dvw(),'text/plain');toast('File .dvw creato');return;
    case 'copydvw':{const txt=dvw();const sel=()=>{const el=document.getElementById('codes');el.textContent=txt;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Testo .dvw selezionato: copialo dal menu')};
      try{navigator.clipboard.writeText(txt).then(()=>toast('File .dvw copiato')).catch(sel)}catch(err){sel()}return;}
    case 'pdftab':exportPdf('tab');return;
    case 'pdfpbp':exportPdf('pbp');return;
    case 'dltxt':saveFile(fileBase()+'_codici.txt',codeText(),'text/plain');return;
    case 'dljson':saveFile(fileBase()+'.json',JSON.stringify(persisted()),'application/json');return;
    case 'copy':{
      const txt=codeText();
      const sel=()=>{const el=document.getElementById('codes');const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Testo selezionato: copialo dal menu')};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Codici copiati')).catch(sel)}catch(err){sel()}
      return;}
  }
  if(['view','statset','player','bench','skill','clearsel','sub','zcancel','map','tap'].includes(act)&&!['dbl'].includes(act)&&S.lines.length===nLines&&hist.length===nHist)saveLocal();else save();
  render();
});
document.addEventListener('change',e=>{
  const el=e.target,act=el.dataset.act,t=el.dataset.t;
  if(!act)return;
  if(S.demo&&['name','roster','lineup'].includes(act)){const tm=S.teams,st=S.start;S=blank();S.teams=tm;S.start=st;hist=[];if(db)subscribe();toast('Esempio rimosso: ora la partita è tua e si salva online')}
  if(act==='import'){
    const f=el.files&&el.files[0];if(!f)return;
    f.text().then(txt=>{
      try{const d=JSON.parse(txt);if(!d.teams||!Array.isArray(d.lines))throw 0;
        snap();S=Object.assign(blank(),d,{view:'scout',statSet:'all',sel:null,pending:null,subMode:null,demo:false});
        if(S.started)predict();save();subscribe();render();toast('Backup importato');
      }catch(e){toast('File non valido: serve un backup .json di Scout Tap')}
    });return;
  }
  if(act==='tl'){const tm=libTeam(teamEdit);if(!tm)return;const k=el.dataset.k;
    if(k==='roster')tm.players=parseRoster(el.value);else tm[k]=el.value.trim()||(k==='name'?'Squadra senza nome':'');
    libSave();pushLibToMatch(tm);render();return}
  if(act==='nmsel'){newForm[t]=el.value;render();return}
  if(act==='nmname'){newForm[t+'n']=el.value;return}
  if(act==='nmfase'){newForm.fase=el.value;return}
  if(act==='info'){if(!S.info)S.info={};S.info[el.dataset.k]=el.value.trim();save();return}
  if(act==='vstart'){S.videoStart=el.value.trim()||'0:00';save();return}
  if(act==='mappl'){S.map.pl=el.value;saveLocal();render();return}
  if(act==='name'){S.teams[t].name=el.value.trim()||(t==='h'?'Casa':'Ospiti');S.demo=false;pushTeamToLib(t)}
  else if(act==='roster'){S.teams[t].players=parseRoster(el.value);S.demo=false;pushTeamToLib(t)}
  else if(act==='setter'){if(!S.startSetter)S.startSetter={h:null,a:null};S.startSetter[t]=el.value?+el.value:null}
  else if(act==='lineup'){const z=+el.dataset.z;S.start[t][z-1]=el.value?+el.value:null;if(S.start[t].length<6)for(let i=0;i<6;i++)S.start[t][i]=S.start[t][i]??null}
  else return;
  save();render();
});

/* ---------- archivio locale delle partite ---------- */
function archIdx(){try{return JSON.parse(localStorage.getItem(KEY+'.idx')||'[]')}catch(e){return[]}}
let archT=null,archWarned=false;
function archPut(now){
  if(!S||S.demo||!(S.teamRef||S.lines.length||S.started))return;
  clearTimeout(archT);
  const run=()=>{try{
    localStorage.setItem(KEY+'.m.'+S.matchId,JSON.stringify(persisted()));
    const idx=archIdx().filter(x=>x.id!==S.matchId);
    idx.unshift({id:S.matchId,...metaOf()});
    localStorage.setItem(KEY+'.idx',JSON.stringify(idx.slice(0,300)));
  }catch(e){if(!archWarned){archWarned=true;toast('Memoria del dispositivo piena: collega il salvataggio online o elimina vecchie partite')}}};
  if(now)run();else archT=setTimeout(run,800);
}
function archGet(id){try{const r=localStorage.getItem(KEY+'.m.'+id);return r?JSON.parse(r):null}catch(e){return null}}
function archDel(id){try{localStorage.removeItem(KEY+'.m.'+id);localStorage.setItem(KEY+'.idx',JSON.stringify(archIdx().filter(x=>x.id!==id)))}catch(e){}}
function matchDate(m){return m.date||m.updatedAt||0}
function allMatches(){
  const map=new Map();
  archIdx().forEach(m=>map.set(m.id,{...m,local:true}));
  (matchList||[]).forEach(m=>{if(String(m.id).startsWith('__'))return;const o=map.get(m.id);if(!o||(m.updatedAt||0)>(o.updatedAt||0))map.set(m.id,{...o,...m,local:!!o})});
  return [...map.values()].sort((a,b)=>matchDate(b)-matchDate(a));
}
const isFinished=m=>!!m.finished||/finita/.test(m.score||'');
async function openAny(id,view){
  archPut(true);
  let d=archGet(id);
  if(db){try{const o=await db.get(id);if(o&&(!d||(o.updatedAt||0)>(d.updatedAt||0)))d=o}catch(e){}}
  if(!d){toast('Partita non trovata');return}
  S=Object.assign(blank(),d,{view,statSet:'all',sel:null,pending:null,subMode:null,libMode:null,dblMode:null,link:null,fault:null,confirmReset:false,demo:false});
  fixArrays();if(!S.setLineups)S.setLineups={};if(!S.startSetter)S.startSetter={h:null,a:null};
  if(S.started&&!S.setOver)predict();
  hist=[];saveLocal();subscribe();render();
}
async function deleteMatch(id){
  archDel(id);
  if(db&&db.del){try{await db.del(id)}catch(e){}}
  matchList=(matchList||[]).filter(m=>m.id!==id);
  if(S.matchId===id&&!S.demo){S=blank();S.view='home';saveLocal()}
  toast('Partita eliminata');render();
}

/* ---------- squadre salvate ---------- */
function libLoad(){try{return JSON.parse(localStorage.getItem(KEY+'.teams')||'null')||{teams:[],updatedAt:0}}catch(e){return{teams:[],updatedAt:0}}}
let LIB=libLoad(),teamEdit=null,teamDel=false,newForm={h:'',a:'',hn:'',an:'',fase:''},delAsk=null;
function libSave(){
  LIB.updatedAt=Date.now();
  try{localStorage.setItem(KEY+'.teams',JSON.stringify(LIB))}catch(e){}
  if(db)db.save('__teams',{teams:LIB.teams,updatedAt:LIB.updatedAt,dev:DEV},{title:'__squadre',updatedAt:LIB.updatedAt,score:'',dev:DEV}).catch(()=>{});
}
async function libPull(){
  if(!db)return;
  try{
    const d=await db.get('__teams');
    if(d&&(d.updatedAt||0)>(LIB.updatedAt||0)){LIB={teams:d.teams||[],updatedAt:d.updatedAt};try{localStorage.setItem(KEY+'.teams',JSON.stringify(LIB))}catch(e){};render()}
    else if(LIB.teams.length&&(LIB.updatedAt||0)>((d&&d.updatedAt)||0))libSave();
  }catch(e){}
}
const libTeam=id=>LIB.teams.find(x=>x.id===id);
function newTeam(name){const tm={id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:name||'Nuova squadra',players:[],coach:'',assistant:''};LIB.teams.push(tm);return tm}
function mergePlayers(base,add){const m=new Map(base.map(p=>[p.n,{...p}]));add.forEach(p=>m.set(p.n,{...p}));return[...m.values()].sort((x,y)=>x.n-y.n)}
// la rosa della partita e quella della squadra salvata restano allineate (si aggiungono o rinominano giocatori, non si tolgono)
function pushTeamToLib(t){
  const id=S.teamRef&&S.teamRef[t];const tm=id&&libTeam(id);if(!tm)return;
  tm.name=S.teams[t].name;tm.players=mergePlayers(tm.players,S.teams[t].players);libSave();
}
function pushLibToMatch(tm){
  if(!S||S.demo||S.finished||!S.teamRef)return;
  for(const t of ['h','a'])if(S.teamRef[t]===tm.id){S.teams[t].name=tm.name;S.teams[t].players=mergePlayers(S.teams[t].players,tm.players);save()}
}
function resumable(){
  if(S&&!S.demo&&!S.finished&&(S.started||S.lines.length||S.teamRef))return{id:S.matchId,title:`${S.teams.h.name} – ${S.teams.a.name}`,score:metaOf().score,current:true};
  return allMatches().find(m=>!isFinished(m))||null;
}

function createMatch(){

  S.teamRef={h:th.id,a:ta.id};
  S.teams={h:{name:th.name,players:th.players.map(p=>({...p}))},a:{name:ta.name,players:ta.players.map(p=>({...p}))}};
  S.info={fase:newForm.fase||'',all_h:th.coach||'',ass_h:th.assistant||'',all_a:ta.coach||'',ass_a:ta.assistant||''};
  S.date=Date.now();
  newForm={h:'',a:'',hn:'',an:'',fase:''};hist=[];
  save();subscribe();render();toast('Partita creata');
}

/* archivio dentro Claude */
function claudeStore(d){return{
  kind:'claude',
  async save(id,body,meta){await d.doc('matches/'+id).set(body);await d.doc('index/'+id).set({title:meta.title,updatedAt:meta.updatedAt,score:meta.score,date:meta.date||0,finished:!!meta.finished})},
  async del(id){await d.doc('matches/'+id).delete();await d.doc('index/'+id).delete()},
  async get(id){const s=await d.doc('matches/'+id).get();return s.exists?s.data():null},
  async list(){const q=await d.collection('index').orderBy('updatedAt','desc').limit(40).get();return q.docs.map(x=>({id:x.id,...x.data()}))},
  watch(id,cb){return d.doc('matches/'+id).onSnapshot(s=>cb(s.exists?s.data():null,s.metadata.hasPendingWrites),()=>{syncSt='err';refreshBadge()})}
}}
/* archivio su Google Sheets (Apps Script): letture in JSONP, scritture in POST */
let jpN=0;
function jsonp(url,params,ms=15000){return new Promise((res,rej)=>{
  const cb='__scout'+(++jpN);const el=document.createElement('script');
  const clean=()=>{clearTimeout(tm);delete window[cb];el.remove()};
  const tm=setTimeout(()=>{clean();rej(new Error('timeout'))},ms);
  window[cb]=d=>{clean();d&&d.error?rej(new Error(d.error)):res(d)};
  el.onerror=()=>{clean();rej(new Error('rete'))};
  el.src=url+(url.includes('?')?'&':'?')+new URLSearchParams({...params,callback:cb});
  document.head.appendChild(el);
})}
function sheetsStore(cfg){
  const q=p=>jsonp(cfg.url,{...p,token:cfg.token});
  return{
    kind:'sheets',
    async save(id,body,meta){
      await fetch(cfg.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:cfg.token,action:'save',id,meta,data:JSON.stringify(body)})});
      const m=await q({action:'meta',id});
      if(!m.exists||m.updatedAt<meta.updatedAt)throw new Error('non confermato');
    },
    async get(id){const r=await q({action:'get',id});return r.exists?r.data:null},
    async del(id){await fetch(cfg.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:cfg.token,action:'delete',id})})},
    async list(){const r=await q({action:'list'});return r.matches||[]},
    watch(id,cb){
      let stop=false,busy=false;
      const tick=async()=>{
        if(stop||busy||document.hidden||writing)return;busy=true;
        try{const m=await q({action:'meta',id});
          if(stop)return;
          if(!m.exists)cb(null);
          else if(m.dev!==DEV&&m.updatedAt>(S.updatedAt||0)){const d=await q({action:'get',id});if(!stop&&d.exists)cb(d.data)}
          else cb({__same:true});
        }catch(e){if(syncSt!=='busy'){syncSt='err';refreshBadge()}}
        busy=false;
      };
      tick();const iv=setInterval(tick,5000);
      return()=>{stop=true;clearInterval(iv)};
    }
  };
}

function queueSync(){if(!db||S.demo)return;syncSt='busy';refreshBadge();clearTimeout(syncT);syncT=setTimeout(push,db.kind==='sheets'?1500:600)}
async function push(){
  if(!db||S.demo)return;
  if(writing){again=true;return}
  writing=true;
  try{await db.save(S.matchId,persisted(),metaOf());syncSt='ok'}
  catch(e){syncSt='err';if(e&&e.code==='quota_exceeded')toast('Spazio online esaurito: elimina vecchie partite')}
  writing=false;
  if(again){again=false;push();return}
  refreshBadge();
}
function refreshBadge(){const el=document.querySelector('.sync');if(el)el.outerHTML=syncBadge()}
function adopt(d){
  const ui={};for(const k of UI_KEYS)ui[k]=S[k];
  S=Object.assign(blank(),d,ui);
  if(S.pending&&!S.started)S.pending=null;
  if(S.started&&!S.pending)predict();
  hist=[];saveLocal();
}
function subscribe(){
  if(unsub){unsub();unsub=null}
  if(!db)return;
  const id=S.matchId;
  unsub=db.watch(id,(d,pending)=>{
    if(id!==S.matchId)return;
    if(!d){if(!S.demo&&!writing)queueSync();return}
    if(d.__same){if(syncSt!=='busy'&&syncSt!=='ok'&&!writing){syncSt='ok';refreshBadge()}return}
    if(d.dev!==DEV&&(d.updatedAt||0)>(S.updatedAt||0)){
      const busy=!!S.pending;adopt(d);
      if(busy)toast('Aggiornato da un altro dispositivo');
      syncSt='ok';render();
    }else if(!pending&&syncSt!=='busy'){syncSt='ok';refreshBadge()}
  });
}
async function listMatches(){
  if(!db)return;
  try{matchList=await db.list()}catch(e){matchList=[]}
  if(['home','archive'].includes(S.view))render();
}
async function openMatch(id){
  try{
    const d=await db.get(id);
    if(!d){toast('Partita non trovata');return}
    S=Object.assign(blank(),d,{view:'scout',statSet:'all',sel:null,pending:null,subMode:null,confirmReset:false,demo:false});
    if(S.started)predict();
    hist=[];saveLocal();subscribe();syncSt='ok';render();toast('Partita aperta');
  }catch(e){toast('Impossibile aprire la partita, riprova')}
}
async function connectStore(store){
  db=store;matchList=null;
  await libPull();
  await listMatches();
  if(!S.demo)subscribe();render();
}
async function initSync(){
  if(IN_CLAUDE){
    const d=await window.claude.use('db');
    if(d){await connectStore(claudeStore(d));return}
  }
  const cfg=sheetsCfg();
  if(cfg){await connectStore(sheetsStore(cfg));return}
  syncSt='local';render();
}
async function linkSheets(url,token){
  url=(url||'').trim();token=(token||'').trim();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)){toast("L'indirizzo deve finire con /exec");return}
  const st=sheetsStore({url,token});
  try{await st.list()}catch(e){toast(`Collegamento non riuscito: ${e.message==='chiave non valida'?'chiave sbagliata':'controlla indirizzo e pubblicazione dello script'}`);return}
  try{localStorage.setItem(KEY+'.sheets',JSON.stringify({url,token}))}catch(e){}
  toast('Google Sheets collegato');await connectStore(st);if(!S.demo)queueSync();
}
function unlinkSheets(){try{localStorage.removeItem(KEY+'.sheets')}catch(e){}if(unsub){unsub();unsub=null}db=null;matchList=null;syncSt='local';render();toast('Salvataggio online scollegato')}
/* file: scarica e importa (solo fuori da Claude, dove i download funzionano) */
function downloadFile(name,text,type){const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
const fileBase=()=>`${new Date().toISOString().slice(0,10)}_${S.teams.h.name}_${S.teams.a.name}`.replace(/[^\w\-]+/g,'_');

S=load();
if(!S||S.demo){S=blank()}
S.view='home';
if(!S.demo&&(S.started||S.lines.length))setTimeout(()=>archPut(true),0);
if(!S.matchId)S.matchId=blank().matchId;
if(!S.srvType)S.srvType={};
if(S.autoSet===undefined)S.autoSet=true;
if(!S.ltimes)S.ltimes=S.lines.map(()=>null);
if(!S.timeouts)S.timeouts={h:0,a:0};
fixArrays();if(!S.setLineups)S.setLineups={};if(S.videoStart==null)S.videoStart='0:00';
if(!S.startSetter)S.startSetter={h:null,a:null};
render();
initSync();
</script>
